<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartSheet Hub — Purchase Successful</title>
</head>

<body>

  <h1>SmartSheet Hub</h1>

  <h2>Payment successful</h2>

  <p id="message">
    Your payment has been received. Preparing your secure download...
  </p>

  <script>
    const message = document.getElementById("message");

    const params = new URLSearchParams(window.location.search);

    const reference =
      params.get("reference");

    if (!reference) {
      message.textContent =
        "Payment received, but the payment reference is missing.";
    } else {

      const functionUrl =
        "https://chnwjktgwiijkxbiwjkc.supabase.co/functions/v1/get-delivery-token";

      async function checkDelivery() {

        try {

          const response =
            await fetch(
              functionUrl +
              "?reference=" +
              encodeURIComponent(reference)
            );

          const result =
            await response.json();

          if (response.ok && result.success && result.token) {

            message.textContent =
              "Your secure download is ready. Redirecting...";

            window.location.href =
              "download.html?token=" +
              encodeURIComponent(result.token);

            return;
          }

          if (response.status === 202 || response.status === 409) {

            message.textContent =
              "Payment confirmed. Preparing your secure download...";

            setTimeout(checkDelivery, 2000);

            return;
          }

          message.textContent =
            result.error ||
            "Unable to prepare your download.";

        } catch (error) {

          message.textContent =
            "We're preparing your download. Please wait...";

          setTimeout(checkDelivery, 3000);
        }
      }

      checkDelivery();
    }
  </script>

</body>
</html>
