<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartSheet Hub — Purchase Successful</title>
</head>

<body>

  <h1>SmartSheet Hub</h1>

  <h2>Payment successful</h2>

  <p id="message">
    Your payment has been received. Preparing your secure download...
  </p>

  <script>
    const message = document.getElementById("message");

    const params = new URLSearchParams(window.location.search);

    /*
      New flow:
      Jjuma returns the customer using our internal
      merchant order ID.
    */
    const orderId =
      params.get("order_id");

    /*
      Backward compatibility:
      Keep supporting the previous reference parameter.
    */
    const reference =
      params.get("reference");

    if (!orderId && !reference) {

      message.textContent =
        "Payment received, but the payment order could not be identified.";

    } else {

      const functionUrl =
        "https://chnwjktgwiijkxbiwjkc.supabase.co/functions/v1/get-delivery-token";

      async function checkDelivery() {

        try {

          /*
            Prefer the new order_id.
            Fall back to the old reference if necessary.
          */

          let requestUrl;

          if (orderId) {

            requestUrl =
              functionUrl +
              "?order_id=" +
              encodeURIComponent(orderId);

          } else {

            requestUrl =
              functionUrl +
              "?reference=" +
              encodeURIComponent(reference);

          }

          const response =
            await fetch(requestUrl);

          const result =
            await response.json();

          /*
            Delivery is ready.
          */

          if (
            response.ok &&
            result.success &&
            result.token
          ) {

            message.textContent =
              "Your secure download is ready. Redirecting...";

            window.location.href =
              "download.html?token=" +
              encodeURIComponent(result.token);

            return;
          }

          /*
            Payment is confirmed but the webhook/token
            process may still be completing.
          */

          if (
            response.status === 202 ||
            response.status === 409
          ) {

            message.textContent =
              "Payment confirmed. Preparing your secure download...";

            setTimeout(
              checkDelivery,
              2000
            );

            return;
          }

          /*
            Something unexpected happened.
          */

          message.textContent =
            result.error ||
            "Unable to prepare your download.";

        } catch (error) {

          /*
            Temporary network/function problem.
            Keep checking instead of failing immediately.
          */

          console.error(
            "Delivery check error:",
            error
          );

          message.textContent =
            "We're preparing your download. Please wait...";

          setTimeout(
            checkDelivery,
            3000
          );
        }
      }

      checkDelivery();
    }
  </script>

</body>
</html>
